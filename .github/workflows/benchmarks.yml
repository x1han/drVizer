name: benchmarks

# Phase 2.2.0 manual-only benchmark workflow.
#
# Trigger key is quoted so YAML 1.1 does not coerce ``on`` to the
# boolean True (it would still parse, but downstream tooling that
# double-loads the file as JSON would see {"on": true} instead of
# {"on": ...}).  ``workflow_dispatch`` is the only child so the
# regular PR CI pipeline (push / pull_request) is unaffected.
"on":
  workflow_dispatch:
    inputs:
      repetitions:
        description: "Timed batches per (workload, primitive, workers) cell"
        required: false
        default: "3"
        type: string

permissions:
  contents: read

jobs:
  bench:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Versions quoted so 3.10/3.11/3.12 are not silently truncated
        # to 3.1 by YAML 1.1 unquoted scalars.
        python-version: ['3.9', '3.10', '3.11', '3.12']

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install build prerequisites
        run: |
          python -m pip install --upgrade pip setuptools wheel Cython

      - name: Install package (editable, compile per-matrix)
        # pyproject build-system already requires Cython>=3 and no
        # .so binaries are tracked, so each matrix leg compiles its
        # own ABI-correct extensions (sidesteps audit P0-10).
        run: |
          pip install -e .

      - name: Install optional BAM runtime
        # pysam is needed for drvizer.bam_parser to import cleanly,
        # even though the BED benchmark path itself never touches BAM.
        run: |
          pip install pysam

      - name: Run benchmark
        run: |
          python benchmarks/bench_bed_concurrency.py \
            --repetitions ${{ github.event.inputs.repetitions || '3' }} \
            --output results-py${{ matrix.python-version }}.json

      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: bench-results-py${{ matrix.python-version }}
          path: results-py${{ matrix.python-version }}.json
          if-no-files-found: error