name: release

# Phase 8 release workflow. Triggered on push tags matching v*.
#
# Two sequential jobs:
#   1. build         -- checkout, setup-python, install build + twine,
#                       python -m build, twine check dist/*, then
#                       upload dist/* as a workflow artifact.
#   2. publish-pypi  -- download the build artifact, then twine upload
#                       dist/* using the PYPI_API_TOKEN secret, gated
#                       on the `pypi` GitHub environment.
#
# TestPyPI canary was removed at the maintainer's request for the
# first v0.1.1 publish -- only a single production token was
# provisioned, so the canary job would block the release. The
# workflow can be extended later with a test-pypi job when both
# tokens (PYPI_API_TOKEN + TESTPYPI_API_TOKEN) are available.
#
# **Manual gate via GitHub environment protection rules.** The `pypi`
# environment MUST be configured with required reviewers in the
# GitHub UI before the first production publish. The YAML alone does
# not enforce manual approval -- the maintainer must set up the
# environment protection rule. This satisfies the Phase 8 pushback
# that PyPI publish is irreversible (only yank, no delete): no
# auto-publish on first run; a maintainer must click "Approve" in the
# GitHub UI for every production upload.
#
# The trigger key is quoted so YAML 1.1 does not coerce ``on`` to the
# boolean True (it would still parse, but downstream tooling that
# double-loads the file as JSON would see {"on": true} instead of
# {"on": ...}). This mirrors the precedent set in benchmarks.yml and
# ci.yml.
"on":
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build:
    name: Build sdist + wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install build prerequisites
        # setuptools<77: 77+ produces Metadata-Version 2.4 with PEP 639
        # license fields (License-Expression, License-File), which the
        # currently-released twine versions cannot validate cleanly
        # (twine 6.x rejects the new fields as malformed; twine 5.x
        # rejects Metadata-Version 2.4 as unsupported). setuptools<77
        # produces the classic 2.1 metadata that all twine versions
        # accept. Lock setuptools + Cython to known-good versions
        # until the PyPA tooling ecosystem stabilizes on PEP 639.
        run: |
          python -m pip install --upgrade pip
          pip install "setuptools<77" wheel "Cython==3.0.11"

      - name: Install build tooling
        run: |
          pip install build twine

      - name: Build sdist + wheel
        run: |
          python -m build

      - name: Twine check
        # Catches metadata / long_description errors before any upload
        # so TestPyPI and PyPI never see a malformed artifact.
        run: |
          twine check dist/*

      - name: Upload build artifact
        # The dist/ directory flows to the publish job via this
        # artifact (without it, the publish-pypi job would have an
        # empty dist/ at upload time).
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish-pypi:
    name: Publish to PyPI (manual gate)
    needs: build
    runs-on: ubuntu-latest
    # Manual gate via GitHub environment protection rules.
    # Configure the `pypi` environment in the GitHub UI with required
    # reviewers BEFORE the first production publish. The YAML alone
    # does not enforce manual approval.
    environment: pypi
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install twine
        # twine is installed in the build job, but each job runs on a
        # fresh runner, so it must be reinstalled here.
        run: |
          python -m pip install --upgrade pip
          pip install twine

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        # For v0.1.1 first publish, upload the sdist only.
        # The plain linux_x86_64 wheel that the build job produces is
        # rejected by PyPI (it requires manylinux tags per PEP 600),
        # and the project does not yet ship a manylinux wheel. The
        # sdist has no platform tag and triggers a local Cython
        # compile on `pip install`, which the project's
        # [build-system].requires already pins (Cython==3.0.11).
        # Future releases should add cibuildwheel / manylinux
        # wheels; tracked in workspace/benchmarks/followup.md.
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          twine upload dist/*.tar.gz