name: release

# Phase 8 release workflow. Triggered on push tags matching v*.
#
# Three sequential jobs:
#   1. build         -- checkout, setup-python, install build + twine,
#                       python -m build, twine check dist/*, then
#                       upload dist/* as a workflow artifact.
#   2. test-pypi     -- download the build artifact, then twine upload
#                       --repository testpypi dist/* using the
#                       TESTPYPI_API_TOKEN secret. This job ALWAYS
#                       runs as a dry-run / canary so the production
#                       publish below gets a real PyPI infrastructure
#                       smoke-test first.
#   3. publish-pypi  -- download the build artifact, then twine upload
#                       dist/* using the PYPI_API_TOKEN secret, gated
#                       on the `pypi` GitHub environment.
#
# **Manual gate via GitHub environment protection rules.** The `pypi`
# environment MUST be configured with required reviewers in the
# GitHub UI before the first production publish. The YAML alone does
# not enforce manual approval -- the maintainer must set up the
# environment protection rule. This satisfies the Phase 8 pushback
# that PyPI publish is irreversible (only yank, no delete): no
# auto-publish on first run; a maintainer must click "Approve" in the
# GitHub UI for every production upload.
#
# The trigger key is quoted so YAML 1.1 does not coerce ``on`` to the
# boolean True (it would still parse, but downstream tooling that
# double-loads the file as JSON would see {"on": true} instead of
# {"on": ...}). This mirrors the precedent set in benchmarks.yml and
# ci.yml.
"on":
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build:
    name: Build sdist + wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install build prerequisites
        run: |
          python -m pip install --upgrade pip setuptools wheel Cython

      - name: Install build tooling
        run: |
          pip install build twine

      - name: Build sdist + wheel
        run: |
          python -m build

      - name: Twine check
        # Catches metadata / long_description errors before any upload
        # so TestPyPI and PyPI never see a malformed artifact.
        run: |
          twine check dist/*

      - name: Upload build artifact
        # The dist/ directory flows to both publish jobs via this
        # artifact (without it, the test-pypi and publish-pypi jobs
        # would have an empty dist/ at upload time).
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  test-pypi:
    name: Publish to TestPyPI (canary)
    needs: build
    runs-on: ubuntu-latest
    environment: testpypi
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install twine
        # twine is installed in the build job, but each job runs on a
        # fresh runner, so it must be reinstalled here.
        run: |
          python -m pip install --upgrade pip
          pip install twine

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to TestPyPI
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.TESTPYPI_API_TOKEN }}
        run: |
          twine upload --repository testpypi dist/*

  publish-pypi:
    name: Publish to PyPI (manual gate)
    needs: test-pypi
    runs-on: ubuntu-latest
    # Manual gate via GitHub environment protection rules.
    # Configure the `pypi` environment in the GitHub UI with required
    # reviewers BEFORE the first production publish. The YAML alone
    # does not enforce manual approval.
    environment: pypi
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install twine
        # twine is installed in the build job, but each job runs on a
        # fresh runner, so it must be reinstalled here.
        run: |
          python -m pip install --upgrade pip
          pip install twine

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          twine upload dist/*